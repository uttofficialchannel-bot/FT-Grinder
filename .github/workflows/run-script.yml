name: Visit Link And Run Script

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to visit'
        required: true
        default: 'https://grinding.tnstats.dev/'
        type: string
      script_files:
        description: 'Script files to load'
        required: false
        default: 'script.js'
        type: string
      local_storage_json:
        description: 'Local storage JSON payload'
        required: false
        default: '{}'
        type: string

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run script
        run: node runner.js